<div style="padding: 32px; max-width: 1000px; margin: 0 auto;">
  <h1>Enterprise Task Dashboard</h1>

  <mat-card style="margin-bottom: 24px; padding: 20px;">
    <mat-card-title>Nova Tarefa</mat-card-title>
    <mat-card-content style="margin-top: 16px;">
      <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" style="display: flex; gap: 16px; align-items: flex-start;">

        <mat-form-field appearance="outline" style="flex: 1;">
          <mat-label>Título</mat-label>
          <input matInput formControlName="title" placeholder="Ex: Implementar pipeline">
        </mat-form-field>

        <mat-form-field appearance="outline" style="flex: 2;">
          <mat-label>Descrição</mat-label>
          <input matInput formControlName="description" placeholder="Ex: Detalhes da tarefa...">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="taskForm.invalid" style="height: 56px;">
          Adicionar
        </button>

      </form>
    </mat-card-content>
  </mat-card>

  <mat-card style="padding: 20px;">
    <mat-card-title>Lista de Tarefas</mat-card-title>
    <mat-card-content style="margin-top: 16px;">

      <table mat-table [dataSource]="tasks" class="mat-elevation-z2" style="width: 100%;">

        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef> Título </th>
          <td mat-cell *matCellDef="let element"> {{element.title}} </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef> Descrição </th>
          <td mat-cell *matCellDef="let element"> {{element.description || 'Sem descrição'}} </td>
        </ng-container>

        <ng-container matColumnDef="priority">
          <th mat-header-cell *matHeaderCellDef> Prioridade </th>
          <td mat-cell *matCellDef="let element"> {{element.priority}} </td>
        </ng-container>

        <ng-container matColumnDef="isCompleted">
          <th mat-header-cell *matHeaderCellDef> Estado </th>
          <td mat-cell *matCellDef="let element">
            <span [style.color]="element.isCompleted ? 'green' : 'orange'">
              {{element.isCompleted ? 'Concluído' : 'Pendente'}}
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

    </mat-card-content>
  </mat-card>
</div>
